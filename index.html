<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ลงเวลาทำงาน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#16324f; --teal:#0e7c66; --amber:#c2571a;
    --bg:#f2f4f6; --card:#ffffff; --line:#dde3e8; --ink:#1c2b36; --mut:#68798a;
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'IBM Plex Sans Thai',sans-serif; background:var(--bg); color:var(--ink); padding:16px; max-width:480px; margin:0 auto; }
  h1 { font-size:1.15rem; color:var(--navy); margin-bottom:2px; }
  .sub { font-size:.8rem; color:var(--mut); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .step-tag { font-size:.7rem; font-weight:700; letter-spacing:.08em; color:var(--teal); text-transform:uppercase; margin-bottom:8px; }
  .toggle { display:flex; gap:8px; }
  .toggle button { flex:1; padding:12px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .toggle button.active-in  { background:var(--teal);  border-color:var(--teal);  color:#fff; }
  .toggle button.active-out { background:var(--amber); border-color:var(--amber); color:#fff; }
  .ok   { color:var(--teal); font-weight:600; font-size:.9rem; }
  .wait { color:var(--mut); font-size:.9rem; }
  .err  { color:#b3261e; font-weight:600; font-size:.85rem; white-space:pre-line; }
  .btn { width:100%; padding:14px; border:0; border-radius:10px; background:var(--navy); color:#fff; font:inherit; font-size:1rem; font-weight:700; cursor:pointer; }
  .btn:disabled { background:#aab6c0; }
  .btn.sm { background:#fff; color:var(--navy); border:1.5px solid var(--navy); font-size:.9rem; padding:10px; }
  #photoPreview { width:100%; border-radius:10px; margin-top:8px; display:none; }
  #result { text-align:center; padding:8px; font-weight:600; white-space:pre-line; }
  input[type=file] { display:none; }
  #debugBox { margin-top:14px; padding:10px; border-radius:8px; background:#fff8e6; border:1px dashed #d8b64a;
    font-size:.7rem; color:#6b5a1e; white-space:pre-wrap; word-break:break-all; display:none; }
</style>
</head>
<body>
  <h1>ลงเวลาทำงาน <span style="font-size:.65rem;color:#0e7c66;font-weight:700">(ทดสอบ: Cloudflare Pages)</span></h1>
  <div class="sub" id="empName">บริษัท อัพเพอร์ คลาส โซลูชัน จำกัด · กำลังเชื่อมต่อ LINE...</div>

  <div class="card">
    <div class="step-tag">1 · ประเภทการลงเวลา</div>
    <div class="toggle">
      <button type="button" id="btnIn"  class="active-in" onclick="setType('เข้างาน')">🟢 เข้างาน</button>
      <button type="button" id="btnOut" onclick="setType('ออกงาน')">🔴 ออกงาน</button>
    </div>
  </div>

  <div class="card">
    <div class="step-tag">2 · สแกน QR ประจำโครงการ</div>
    <button type="button" class="btn sm" id="scanBtn" onclick="scanQr()">📷 แตะเพื่อสแกน QR Code</button>
    <p id="qrStatus" class="wait" style="margin-top:8px">ยังไม่ได้สแกน</p>
  </div>

  <div class="card">
    <div class="step-tag">3 · ถ่ายรูปยืนยันตัวตน</div>
    <button type="button" class="btn sm" onclick="document.getElementById('photoInput').click()">📷 ถ่ายรูป (กล้องหน้า)</button>
    <input type="file" id="photoInput" accept="image/*" capture="user" onchange="onPhoto(this)">
    <img id="photoPreview" alt="ตัวอย่างรูป">
    <p id="photoStatus" class="wait">ยังไม่ได้ถ่ายรูป</p>
  </div>

  <div class="card">
    <div class="step-tag">4 · ตำแหน่งปัจจุบัน</div>
    <p id="gpsStatus" class="wait">กำลังขอพิกัด GPS...</p>
  </div>

  <button type="button" class="btn" id="submitBtn" onclick="submitCheckinForm()" disabled>บันทึกเวลา</button>
  <div id="result"></div>
  <div id="debugBox"></div>

<script>
  // ============================================================
  // 🔧 ตั้งค่า 2 ค่านี้ก่อนใช้งานจริง
  // ============================================================
  const LIFF_ID = '2010813974-7hkwkaGj';              // เอามาจาก LINE Developers Console แท็บ LIFF
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdze7qBvp2WECwLoz9n6kGbz5GkKiL_Zmbag6tzT51O7vYerPQFLUltIcC3aqNlbTt/exec'; // Web app URL ของ Apps Script (ลงท้าย /exec)
  // ============================================================

  const state = { type:'เข้างาน', qr:null, photo:null, lat:null, lng:null, userId:null, busy:false };

  function debugLog(msg) {
    const box = document.getElementById('debugBox');
    box.style.display = 'block';
    const time = new Date().toLocaleTimeString('th-TH', { hour12:false });
    box.textContent += `[${time}] ${msg}\n`;
  }

  function setType(t) {
    state.type = t;
    document.getElementById('btnIn').className  = t==='เข้างาน' ? 'active-in'  : '';
    document.getElementById('btnOut').className = t==='ออกงาน' ? 'active-out' : '';
  }

  function refresh() {
    document.getElementById('submitBtn').disabled =
      !(state.qr && state.photo && state.userId) || state.busy;
  }

  // ---- เรียก Apps Script แบบ API ผ่าน fetch() แทน google.script.run ----
  // ใช้ Content-Type: text/plain เพื่อเลี่ยง CORS preflight (OPTIONS request)
  // ซึ่ง Apps Script Web App ไม่รองรับ ถ้าส่ง Content-Type: application/json
  // ตรงๆ เบราว์เซอร์จะส่ง preflight ก่อนแล้วเจอ error ทันที
  async function callAppsScript(action, payload) {
    debugLog('📡 fetch เริ่ม: action=' + action + ' → ' + APPS_SCRIPT_URL);
    let res;
    try {
      res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, payload }),
        redirect: 'follow',
      });
    } catch (networkErr) {
      debugLog('❌ fetch throw (network/CORS ก่อนได้ response): ' + networkErr.message);
      throw networkErr;
    }
    debugLog('📥 fetch ได้ response: status=' + res.status + ' type=' + res.type + ' ok=' + res.ok + ' redirected=' + res.redirected);
    const proxyDebug = res.headers.get('X-Proxy-Debug');
    if (proxyDebug) debugLog('🔍 Proxy debug: ' + proxyDebug);
    if (res.type === 'opaque' || res.type === 'opaqueredirect') {
      debugLog('⚠️ response type เป็น opaque — เบราว์เซอร์บล็อกไม่ให้อ่านเนื้อหา (CORS จริง)');
      throw new Error('Response ถูกบล็อกด้วย CORS (opaque response) — อ่านเนื้อหาไม่ได้');
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    debugLog('📄 response text (' + text.length + ' ตัวอักษร): ' + text.slice(0, 200));
    return JSON.parse(text);
  }

  // ---- LIFF init ----
  const t0 = new Date().toLocaleTimeString('th-TH', { hour12:false });
  debugLog('[' + t0 + '] เริ่มเรียก liff.init() (origin: ' + location.origin + ')');

  let liffInitSettled = false;
  setTimeout(() => {
    if (!liffInitSettled) debugLog('⏰ TIMEOUT: liff.init() ไม่ resolve/reject ภายใน 8 วินาที');
  }, 8000);

  liff.init({ liffId: LIFF_ID }).then(async () => {
    liffInitSettled = true;
    debugLog('✅ liff.init สำเร็จ! isLoggedIn=' + liff.isLoggedIn() + ', isInClient=' + liff.isInClient());
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    state.userId = profile.userId;
    document.getElementById('empName').textContent = 'สวัสดี ' + profile.displayName;
    refresh();
  }).catch(e => {
    liffInitSettled = true;
    document.getElementById('empName').textContent = 'เชื่อมต่อ LINE ไม่สำเร็จ: ' + e.message;
    debugLog('❌ liff.init ล้มเหลว: ' + (e && e.message));
  });

  // ---- QR scanner ผ่าน LINE native scanner ----
  function scanQr() {
    const statusEl = document.getElementById('qrStatus');
    statusEl.className = 'wait';
    statusEl.textContent = '⏳ กำลังเรียกกล้อง...';
    debugLog('กดปุ่มสแกน: isLoggedIn=' + liff.isLoggedIn() + ', isInClient=' + liff.isInClient());

    if (typeof liff.scanCodeV2 !== 'function') {
      statusEl.className = 'err';
      statusEl.textContent = '⚠️ อุปกรณ์นี้ไม่รองรับการสแกน กรุณาเปิดผ่านแอป LINE บนมือถือ';
      return;
    }
    if (!liff.isInClient()) {
      statusEl.className = 'err';
      statusEl.textContent = '⚠️ การสแกน QR ใช้ได้เฉพาะเมื่อเปิดจากภายในแอป LINE บนมือถือเท่านั้น';
      return;
    }
    if (!liff.isLoggedIn()) {
      statusEl.className = 'err';
      statusEl.textContent = '⚠️ เซสชันหลุด กรุณาปิดหน้านี้แล้วเปิดใหม่';
      return;
    }
    try {
      liff.scanCodeV2().then((result) => {
        debugLog('scanCodeV2 then: ' + JSON.stringify(result));
        if (!result || !result.value) {
          statusEl.className = 'wait';
          statusEl.textContent = 'ไม่ได้สแกน หรือยกเลิกการสแกน';
          return;
        }
        state.qr = result.value.trim();
        statusEl.className = 'ok';
        statusEl.textContent = '✅ สแกนสำเร็จ: ' + state.qr;
        refresh();
      }).catch((err) => {
        const detail = (err && (err.message || err.code || JSON.stringify(err))) || 'ไม่ทราบสาเหตุ';
        statusEl.className = 'err';
        statusEl.textContent = '❌ สแกนไม่สำเร็จ: ' + detail;
        debugLog('scanCodeV2 catch: ' + detail);
      });
    } catch (syncErr) {
      statusEl.className = 'err';
      statusEl.textContent = '❌ เรียกสแกนไม่สำเร็จ: ' + (syncErr && syncErr.message);
    }
  }

  // ---- Photo → ย่อขนาด → base64 ----
  function onPhoto(input) {
    const file = input.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const MAX = 800, ratio = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * ratio; c.height = img.height * ratio;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      state.photo = c.toDataURL('image/jpeg', 0.75);
      const pv = document.getElementById('photoPreview');
      pv.src = state.photo; pv.style.display = 'block';
      document.getElementById('photoStatus').className = 'ok';
      document.getElementById('photoStatus').textContent = '✅ ถ่ายรูปเรียบร้อย';
      refresh();
    };
    img.src = URL.createObjectURL(file);
  }

  // ---- GPS ----
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.lat = pos.coords.latitude.toFixed(6);
      state.lng = pos.coords.longitude.toFixed(6);
      const el = document.getElementById('gpsStatus');
      el.className = 'ok';
      el.textContent = '✅ ได้พิกัดแล้ว (' + state.lat + ', ' + state.lng + ')';
    },
    (err) => {
      document.getElementById('gpsStatus').textContent = '⚠️ ไม่ได้รับพิกัด (' + err.message + ')';
    },
    { enableHighAccuracy:true, timeout:10000 }
  );

  // ---- Submit ----
  async function submitCheckinForm() {
    debugLog('▶️ กดปุ่มบันทึกเวลา');
    state.busy = true; refresh();
    const res = document.getElementById('result');
    res.textContent = '⏳ กำลังบันทึก...'; res.style.color = 'var(--mut)';

    let settled = false;
    setTimeout(() => {
      if (!settled) debugLog('⏰ TIMEOUT: submitCheckin ไม่ resolve/reject ภายใน 10 วินาที — fetch ค้างจริง');
    }, 10000);

    try {
      const r = await callAppsScript('submitCheckin', {
        lineUserId: state.userId, type: state.type, qrCode: state.qr,
        lat: state.lat, lng: state.lng, photoBase64: state.photo,
      });
      settled = true;
      state.busy = false;
      res.textContent = r.msg;
      res.style.color = r.ok ? 'var(--teal)' : 'var(--amber)';
      if (r.ok) setTimeout(() => liff.closeWindow(), 2500);
      else refresh();
    } catch (e) {
      settled = true;
      state.busy = false; refresh();
      res.textContent = '❌ เกิดข้อผิดพลาด: ' + e.message;
      res.style.color = 'var(--amber)';
      debugLog('❌ submitCheckin catch: ' + e.message);
    }
  }
</script>
</body>
</html>
