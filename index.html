<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
  :root {
    --green:#06C755; --green-dark:#04A344; --green-light:#E8FAF0;
    --red:#FF5252; --red-light:#FFF0F0;
    --gray-50:#F8F9FA; --gray-100:#F1F3F5; --gray-200:#E9ECEF;
    --gray-400:#ADB5BD; --gray-600:#6C757D; --gray-800:#343A40; --gray-900:#212529;
    --radius:16px; --radius-sm:10px; --shadow:0 4px 24px rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',sans-serif;background:var(--gray-50);color:var(--gray-900);min-height:100vh;padding-bottom:40px}

  .header{background:white;padding:20px 20px 16px;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:10}
  .header-top{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .logo{width:36px;height:36px;background:var(--green);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .header h1{font-size:18px;font-weight:700}
  .header .date{font-size:13px;color:var(--gray-600);margin-top:2px}

  .profile-card{background:white;margin:16px;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--green-light);border:2px solid var(--green);overflow:hidden;flex-shrink:0}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--green)}
  .profile-info h2{font-size:16px;font-weight:600}
  .profile-info p{font-size:13px;color:var(--gray-600);margin-top:2px}
  .status-badge{margin-left:auto;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;flex-shrink:0}
  .status-badge.out{background:var(--gray-100);color:var(--gray-600)}
  .status-badge.in{background:var(--green-light);color:var(--green-dark)}

  .summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 16px 16px}
  .summary-card{background:white;border-radius:var(--radius-sm);padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
  .summary-card .label{font-size:11px;color:var(--gray-600);margin-bottom:4px}
  .summary-card .value{font-size:17px;font-weight:700}
  .summary-card .value.green{color:var(--green-dark)}
  .summary-card .value.red{color:var(--red)}

  .section{background:white;margin:0 16px 16px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .section-header{padding:14px 16px;border-bottom:1px solid var(--gray-100);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}

  .camera-area{position:relative;background:var(--gray-900);aspect-ratio:4/3;overflow:hidden}
  #video{width:100%;height:100%;object-fit:cover;display:block}
  #preview-img{width:100%;height:100%;object-fit:cover;display:none;position:absolute;top:0;left:0}
  .camera-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:white;background:rgba(0,0,0,0.3);transition:opacity 0.3s}
  .camera-overlay.hidden{opacity:0;pointer-events:none}
  .camera-overlay .big{font-size:40px}
  .camera-overlay p{font-size:14px;opacity:0.9}

  .camera-controls{padding:16px;display:flex;align-items:center;justify-content:center;gap:20px}
  .btn-shutter{width:64px;height:64px;border-radius:50%;border:3px solid var(--green);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 2px 12px rgba(6,199,85,0.3);transition:all 0.15s}
  .btn-shutter:active{transform:scale(0.93)}
  .btn-retake{padding:8px 18px;border-radius:20px;border:1px solid var(--gray-200);background:white;color:var(--gray-800);font-size:13px;font-family:'Sarabun',sans-serif;cursor:pointer;display:none}

  .location-row{padding:14px 16px;display:flex;align-items:center;gap:12px}
  .loc-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .loc-icon.loading{background:var(--gray-100)}
  .loc-icon.success{background:var(--green-light)}
  .loc-icon.error{background:var(--red-light)}
  .loc-text{flex:1}
  .loc-text .loc-title{font-size:14px;font-weight:500}
  .loc-text .loc-detail{font-size:12px;color:var(--gray-600);margin-top:2px}
  .btn-refresh{padding:6px 12px;border-radius:20px;border:1px solid var(--gray-200);background:white;font-size:12px;font-family:'Sarabun',sans-serif;cursor:pointer;color:var(--gray-600)}

  .geo-alert{margin:0 16px 16px;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;display:none;gap:8px;line-height:1.6}
  .geo-alert.outside{background:var(--red-light);color:#C62828;border:1px solid #FFCDD2;display:block}
  .geo-alert.inside{background:var(--green-light);color:var(--green-dark);border:1px solid #C8E6C9;display:block}

  .action-area{padding:0 16px}
  .btn-main{width:100%;padding:17px;border-radius:var(--radius);border:none;font-size:17px;font-weight:700;font-family:'Sarabun',sans-serif;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-main.checkin{background:var(--green);color:white;box-shadow:0 4px 20px rgba(6,199,85,0.35)}
  .btn-main.checkout{background:var(--red);color:white;box-shadow:0 4px 20px rgba(255,82,82,0.35)}
  .btn-main:disabled{background:var(--gray-200);color:var(--gray-400);box-shadow:none;cursor:not-allowed}
  .btn-main:not(:disabled):active{transform:scale(0.98)}

  .spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .history-list{padding:0 4px}
  .history-item{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--gray-100)}
  .history-item:last-child{border-bottom:none}
  .h-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .h-dot.in{background:var(--green)}
  .h-dot.out{background:var(--red)}
  .h-info{flex:1}
  .h-info .h-type{font-size:13px;font-weight:600}
  .h-info .h-loc{font-size:12px;color:var(--gray-600)}
  .h-time{font-size:14px;font-weight:600;color:var(--gray-800)}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gray-900);color:white;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;z-index:999}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  canvas{display:none}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">🕐</div>
    <div><h1>ระบบลงเวลางาน</h1></div>
  </div>

</div>

  <div class="avatar">
    <div class="avatar-placeholder" id="av-placeholder">👤</div>

  </div>

<div class="section">
  <div class="section-header">📷 ถ่ายรูปยืนยันตัวตน</div>
  <div class="camera-area">
    <video id="video" autoplay playsinline muted></video>
    <img id="preview-img" alt="preview">
    <div class="camera-overlay" id="cam-overlay">
      <div class="big">📷</div>
      <p>กดปุ่มด้านล่างเพื่อถ่ายรูป</p>
    </div>
  </div>
  <div class="camera-controls">
    <button class="btn-retake" id="btn-retake" onclick="retake()">🔄 ถ่ายใหม่</button>
    <button class="btn-shutter" id="btn-shutter" onclick="capture()">📷</button>
  </div>
  <canvas id="canvas"></canvas>
</div>

<div class="section">
  <div class="section-header">📍 ตำแหน่งปัจจุบัน</div>
  <div class="location-row">
    <div class="loc-icon loading" id="loc-icon">⏳</div>
    <div class="loc-text">
      <div class="loc-title" id="loc-title">กำลังระบุตำแหน่ง...</div>
      <div class="loc-detail" id="loc-detail">กรุณารอสักครู่</div>
    </div>
    <button class="btn-refresh" onclick="getLocation()">🔄 รีเฟรช</button>
  </div>
</div>

<div class="geo-alert" id="geo-alert"></div>

<div class="action-area">
  <button class="btn-main checkin" id="btn-main" onclick="submit()" disabled>
    ถ่ายรูปและระบุตำแหน่งก่อน
  </button>
</div>

<div class="section" style="margin-top:16px">
  <div class="section-header">📋 ประวัติวันนี้</div>
  <div class="history-list" id="history-list">
    <div class="history-item"><div style="color:var(--gray-400);font-size:13px">ยังไม่มีประวัติวันนี้</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const LIFF_ID = '2010117967-QjNoEycw';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby_SlF7bWsXiN2zg6DGp_LyA6wGS-Z-VCZ3DEFQAN-X1T7J9aBBbIep9EJg7ncOsCB7qQ/exec';

const OFFICES = [
  { id:'s_oasis',   name:'S-OASIS',        lat:13.8074702,          lng:100.556688,          radius:200 },
  { id:'vana_wv17', name:'VANA WV17',      lat:13.8049706,          lng:100.4424956,         radius:200 },
  { id:'cinquieme', name:'CINQUIEME KK10', lat:13.7597684,          lng:100.6694346,         radius:200 },
  { id:'Armtest',   name:'Arm Test',       lat:13.818153933830375,  lng:100.33551262760439,  radius:500 },
];
// ==================

let profile=null, lat=null, lng=null, photo=null;
let hasPhoto=false, hasLoc=false, checkedIn=false, stream=null, nearest=null;

async function init() {
  tick(); setInterval(tick,1000);
  await initLiff();
  startCamera();
  getLocation();
}

function tick() {
  const n=new Date();
  const days=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  document.getElementById('clock').textContent=
    `วัน${days[n.getDay()]}ที่ ${n.getDate()} ${months[n.getMonth()]} ${n.getFullYear()+543} เวลา ${n.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'})} น.`;
}

async function initLiff() {
  try {
    await liff.init({liffId:LIFF_ID});
    if (!liff.isLoggedIn()){liff.login();return;}
    profile = await liff.getProfile();
    document.getElementById('user-name').textContent = profile.displayName;
    document.getElementById('user-sub').textContent  = 'LINE: '+profile.userId.slice(0,12)+'...';
    if (profile.pictureUrl) {
      document.getElementById('av-img').src=profile.pictureUrl;
      document.getElementById('av-img').style.display='block';
      document.getElementById('av-placeholder').style.display='none';
    }
    loadHistory();
  } catch(e) {
    profile={displayName:'ทดสอบ',userId:'dev-'+Date.now()};
    document.getElementById('user-name').textContent='ทดสอบระบบ';
    document.getElementById('user-sub').textContent='dev-mode';
  }
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    const v=document.getElementById('video');
    v.srcObject=stream;
    v.onloadedmetadata=()=>document.getElementById('cam-overlay').classList.add('hidden');
  } catch(e) {
    document.getElementById('cam-overlay').innerHTML='<div class="big">❌</div><p>กรุณาอนุญาตการใช้กล้อง</p>';
  }
}

function capture() {
  const v=document.getElementById('video'), c=document.getElementById('canvas');
  c.width=v.videoWidth||640; c.height=v.videoHeight||480;
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0);
  const now=new Date();
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(0,c.height-32,c.width,32);
  ctx.fillStyle='white'; ctx.font='bold 13px Sarabun,sans-serif';
  ctx.fillText(now.toLocaleString('th-TH'),10,c.height-10);
  photo=c.toDataURL('image/jpeg',0.75).split(',')[1];
  const p=document.getElementById('preview-img');
  p.src=c.toDataURL('image/jpeg',0.75); p.style.display='block';
  document.getElementById('cam-overlay').classList.add('hidden');
  document.getElementById('btn-retake').style.display='block';
  document.getElementById('btn-shutter').style.display='none';
  if(stream) stream.getTracks().forEach(t=>t.stop());
  hasPhoto=true; checkReady(); toast('✅ ถ่ายรูปเรียบร้อย');
}

function retake() {
  document.getElementById('preview-img').style.display='none';
  document.getElementById('btn-retake').style.display='none';
  document.getElementById('btn-shutter').style.display='block';
  hasPhoto=false; photo=null; startCamera(); checkReady();
}

function getLocation() {
  const icon=document.getElementById('loc-icon');
  const title=document.getElementById('loc-title');
  const detail=document.getElementById('loc-detail');
  icon.className='loc-icon loading'; icon.textContent='⏳';
  title.textContent='กำลังระบุตำแหน่ง...'; detail.textContent='กรุณารอสักครู่';
  hasLoc=false; checkReady();

  if (!navigator.geolocation) {
    icon.className='loc-icon error'; icon.textContent='❌';
    title.textContent='ไม่รองรับ GPS'; return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    lat=pos.coords.latitude; lng=pos.coords.longitude;
    const acc=Math.round(pos.coords.accuracy);

    let close=null, closeDist=Infinity;
    for (const o of OFFICES) {
      const d=dist(lat,lng,o.lat,o.lng);
      if(d<closeDist){closeDist=d;close=o;}
    }
    nearest=close;
    const inSite=closeDist<=close.radius;

    icon.className='loc-icon success'; icon.textContent='📍';
    title.textContent=close.name+(inSite?' ✅':' ⚠️');
    detail.textContent=`ห่าง ${Math.round(closeDist)} ม. | ความแม่น ±${acc} ม.`;

    const al=document.getElementById('geo-alert');
    if(inSite){
      al.className='geo-alert inside';
      al.innerHTML=`✅ อยู่ในบริเวณ <strong>${close.name}</strong> (ห่าง ${Math.round(closeDist)} ม.)`;
    } else {
      const rows=OFFICES.map(o=>{
        const d=Math.round(dist(lat,lng,o.lat,o.lng));
        return `${d<=o.radius?'✅':'📍'} ${o.name}: ${d} ม.`;
      }).join('<br>');
      al.className='geo-alert outside';
      al.innerHTML=`⚠️ อยู่นอกบริเวณสาขาทั้งหมด<br><small>${rows}</small>`;
    }
    hasLoc=true; checkReady();
  }, err=>{
    icon.className='loc-icon error'; icon.textContent='❌';
    title.textContent='ไม่สามารถระบุตำแหน่งได้';
    detail.textContent='กรุณาอนุญาตการใช้ตำแหน่งแล้วกด รีเฟรช';
    document.getElementById('geo-alert').className='geo-alert';
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function dist(a,b,c,d){
  const R=6371000,dA=(c-a)*Math.PI/180,dB=(d-b)*Math.PI/180;
  const x=Math.sin(dA/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dB/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function checkReady(){
  const btn=document.getElementById('btn-main');
  if(!btn) return;
  if(hasPhoto&&hasLoc){
    btn.disabled=false;
    if(checkedIn){
      btn.className='btn-main checkout';
      btn.innerHTML='🔴 ลงเวลาออกงาน';
    } else {
      btn.className='btn-main checkin';
      btn.innerHTML='🟢 ลงเวลาเข้างาน';
    }
  } else {
    btn.disabled=true;
    btn.className='btn-main checkin';
    btn.innerHTML= !hasPhoto ? '📷 ถ่ายรูปก่อนลงเวลา' : '⏳ รอระบุตำแหน่ง...';
  }
}

async function submit(){
  const btn=document.getElementById('btn-main');
  btn.disabled=true;
  btn.innerHTML='<div class="spinner"></div><span>กำลังบันทึก...</span>';

  const type=checkedIn?'checkout':'checkin';
  const payload={
    type, userId:profile?.userId||'dev',
    displayName:profile?.displayName||'ทดสอบ',
    lat, lng, photoBase64:photo,
    timestamp:new Date().toISOString(),
    officeId:nearest?.id||'', officeName:nearest?.name||'',
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
      redirect: 'follow'
    });

    checkedIn=!checkedIn;
    const badge=document.getElementById('status-badge');
    const t=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    if(checkedIn){
      badge.textContent='✅ เข้างานแล้ว'; badge.className='status-badge in';
      document.getElementById('sum-in').textContent=t;
    } else {
      badge.textContent='⏹ ออกงานแล้ว'; badge.className='status-badge out';
      document.getElementById('sum-out').textContent=t;
    }
    toast(type==='checkin'?'✅ ลงเวลาเข้างานสำเร็จ!':'✅ ลงเวลาออกงานสำเร็จ!');
    addHistory(type,lat,lng);
    retake();
  } catch(e){
    toast('❌ '+e.message);
  }
  checkReady();
}

function addHistory(type,la,lo){
  const list=document.getElementById('history-list');
  if(list.querySelector('[style]'))list.innerHTML='';
  const t=new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  const el=document.createElement('div'); el.className='history-item';
  el.innerHTML=`<div class="h-dot ${type==='checkin'?'in':'out'}"></div>
    <div class="h-info"><div class="h-type">${type==='checkin'?'เข้างาน':'ออกงาน'}</div>
    <div class="h-loc">📍 ${la.toFixed(5)}, ${lo.toFixed(5)}</div></div>
    <div class="h-time">${t}</div>`;
  list.appendChild(el);
}

function saveState(type, t) {
  const today = new Date().toLocaleDateString('th-TH');
  const state = JSON.parse(localStorage.getItem('attendance') || '{}');
  if (state.date !== today) {
    // วันใหม่ รีเซ็ต
    localStorage.setItem('attendance', JSON.stringify({
      date: today, checkin: null, checkout: null, records: []
    }));
  }
  const s = JSON.parse(localStorage.getItem('attendance'));
  if (type === 'checkin' && !s.checkin) s.checkin = t;
  if (type === 'checkout') s.checkout = t;
  s.records = s.records || [];
  s.records.push({ type, time: t });
  localStorage.setItem('attendance', JSON.stringify(s));
}

function loadHistory(){
  if (!profile) return;
  const today = new Date().toLocaleDateString('th-TH');

  // ใช้ JSONP — เพิ่ม script tag แทน fetch เพื่อหลีกเลี่ยง CORS
  window._historyCallback = function(data) {
    try {
      const records = data.records || [];
      if (records.length === 0) return;

      const list = document.getElementById('history-list');
      list.innerHTML = '';
      records.forEach(r => {
        const el = document.createElement('div'); el.className = 'history-item';
        el.innerHTML = `<div class="h-dot ${r.type==='checkin'?'in':'out'}"></div>
          <div class="h-info"><div class="h-type">${r.type==='checkin'?'เข้างาน':'ออกงาน'}</div></div>
          <div class="h-time">${r.time}</div>`;
        list.appendChild(el);
      });

      if (data.checkinTime)  document.getElementById('sum-in').textContent  = data.checkinTime;
      if (data.checkoutTime) document.getElementById('sum-out').textContent = data.checkoutTime;
      if (data.totalHours)   document.getElementById('sum-hrs').textContent = data.totalHours + ' ชม.';

      const last = records[records.length - 1];
      checkedIn = last.type === 'checkin';
      const badge = document.getElementById('status-badge');
      if (checkedIn) {
        badge.textContent = '✅ เข้างานแล้ว'; badge.className = 'status-badge in';
      } else {
        badge.textContent = '⏹ ออกงานแล้ว'; badge.className = 'status-badge out';
      }
      checkReady();
    } catch(e) {}
  };

  const script = document.createElement('script');
  script.src = GAS_URL + '?action=history&userId=' + encodeURIComponent(profile.userId) + '&callback=_historyCallback';
  script.onerror = () => {};
  document.head.appendChild(script);
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

init();
</script>
</body>
</html>
